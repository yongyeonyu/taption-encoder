name: CI

# 构建 + 全量单元测试。规则见 docs/code-review/README.md §6。
#
# 为什么是 self-hosted：GitHub 托管的 macos-26 镜像只带 Xcode 26.6 / iOS 26.x SDK，
# 而本项目需要 iOS 27 SDK（例如 AVAudioSession.activate(options:completionHandler:)）。
# 托管 runner 连编译都过不去，只能跑在维护者这台装了 Xcode 27 的 Mac 上。
#
# ⚠️ 安全：本仓库是 public，而 runner 会执行 workflow 里写的任何东西。
# 对 pull_request 事件，workflow 文件取自 PR 本身 —— 也就是说 fork 的 PR 可以改
# workflow，然后在这台 Mac 上执行任意命令（token、Keychain、签名证书都在里面）。
# 两道防线，任何一道都不要拆：
#   1. 下面的 job 级 `if`：fork 的 PR 在分配 runner 之前就被跳过；
#   2. 仓库设置「Require approval for all outside collaborators」：
#      fork PR 的 workflow 根本不会启动，除非人工点批准。
# 还有一条软防线：分支保护没有把本 workflow 设为必需检查，所以 runner 掉线时
# job 会一直排队，但不会把合并卡死。详见 docs/code-review/README.md §6。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # fork 的 PR 永远不碰这台机器。push 事件没有 pull_request 字段，走左边分支。
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, bokki]
    timeout-minutes: 45

    # 这台 runner 是一台普通桌面 Mac，会继承「启动它的那个 shell」的环境变量。
    # 如果它是从带 shell 包装器的会话里启动的（比如某些 agent 沙箱会包装 rm 和
    # node 的 fs 模块），job 会在跑任何代码之前就失败：
    #
    #   Run actions/checkout@v4 → failure          (18s，Check toolchain 被 skipped)
    #   Error: File was unable to be removed
    #     Error: [safe-delete][SAFE_DELETE_BULK_CONFIRM_REQUIRED] {"count":50,...}
    #
    # 原因是 checkout 要删掉上一次的检出目录，而包装器拒绝一次删除 50 个以上的文件。
    # 这不是仓库的问题，但只能在仓库这一侧修：job 级 env 对所有 step 生效（包括
    # `uses:` 的 action），所以在这里把环境拉回系统默认值。
    #
    # NODE_OPTIONS 是真正的原因——它让每个 node 进程预加载一个包装 fs 的模块，
    # 而 actions/checkout 正是 node 写的。BASH_ENV 同理，作用于 `bash -e {0}` 的
    # run step。PATH 只留系统目录，避免 shim 里的 rm 被优先解析到。
    #
    # BASH_ENV 指向 /dev/null 而不是空串：bash 只检查变量是否存在，空串会让它去
    # source 一个空文件名，反而可能报错。
    env:
      NODE_OPTIONS: ""
      BASH_ENV: /dev/null
      PATH: /usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin

    steps:
      - uses: actions/checkout@v4

      - name: Check toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          VERSION=$(xcodebuild -version | head -1 | awk '{print $2}')
          if [ "${VERSION%%.*}" -lt 27 ]; then
            echo "::error title=Xcode too old::Xcode $VERSION cannot build this project; it needs the iOS 27 SDK."
            exit 1
          fi

      # CI 和 pre-push hook 调同一个脚本，这样「验证通过」只有一个定义，
      # 不会出现「本地绿、CI 红」这种两套标准。
      #
      # 路径用 shell 的 $RUNNER_TEMP 拼，不用 ${{ runner.temp }}：
      # runner 上下文在 job 级 env 里不可用（GitHub 会报 Unrecognized named-value: 'runner'，
      # 整个 workflow 直接解析失败、0 个 job）。放在 run 里就不存在这个限制。
      - name: Build and test
        run: |
          set -euo pipefail
          export TAPTION_DERIVED_DATA="$RUNNER_TEMP/derived"
          export TAPTION_LOG="$RUNNER_TEMP/verify.log"
          export TAPTION_RESULT_BUNDLE="$RUNNER_TEMP/TestResults.xcresult"
          ./scripts/verify.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ${{ runner.temp }}/TestResults.xcresult
            ${{ runner.temp }}/verify.log
          retention-days: 7
          if-no-files-found: warn
