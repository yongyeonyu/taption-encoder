name: CI

# 代码审查的第一道闸门：构建 + 全量单元测试。
# 规则见 docs/code-review/README.md §6。
#
# 已知限制（2026-10-24 实测）：GitHub 托管的 macos-26 镜像只带 Xcode 26.6 / iOS 26.x SDK，
# 而本项目需要 iOS 27 SDK（例如 AVAudioSession.activate(options:completionHandler:)）。
# 因此 detect-xcode 会先探测版本，低于 27 时跳过构建并给出 warning，
# 而不是丢出一个看不懂的编译错误。等镜像更新（或接入 self-hosted runner）后自动恢复。
#
# 首次设为必需检查前，请先手动跑一次（Actions → CI → Run workflow），
# 确认 "Build and test" 真的执行了、而不是被跳过。

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-xcode:
    # Xcode 27 需要 macOS 26.6+。
    runs-on: macos-26
    timeout-minutes: 10
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      version: ${{ steps.check.outputs.version }}

    steps:
      - name: Check Xcode version
        id: check
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app
          VERSION=$(xcodebuild -version | head -1 | awk '{print $2}')
          MAJOR=${VERSION%%.*}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "detected Xcode $VERSION"
          if [ "$MAJOR" -ge 27 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Xcode too old::Runner ships Xcode $VERSION, this project needs 27+ (iOS 27 SDK). Build and test were skipped, so this run proves nothing about the code."
          fi

  build-and-test:
    needs: detect-xcode
    if: needs.detect-xcode.outputs.ready == 'true'
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Create simulator
        id: sim
        run: |
          set -euo pipefail
          RUNTIME=$(xcrun simctl list runtimes \
            | grep -oE 'com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+' | tail -1)
          TYPE=""
          for name in "iPhone 17" "iPhone 16" "iPhone 15"; do
            line=$(xcrun simctl list devicetypes | grep -F "$name (" | head -1 || true)
            if [ -n "$line" ]; then
              TYPE=$(echo "$line" | grep -oE 'com\.apple\.CoreSimulator\.SimDeviceType\.[A-Za-z0-9.-]+')
              break
            fi
          done
          if [ -z "$RUNTIME" ] || [ -z "$TYPE" ]; then
            echo "找不到可用的 runtime 或 device type"; exit 1
          fi
          echo "runtime=$RUNTIME"
          echo "type=$TYPE"
          UDID=$(xcrun simctl create "CI-Phone" "$TYPE" "$RUNTIME")
          xcrun simctl boot "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          set -o pipefail
          rm -rf "$RUNNER_TEMP/TestResults.xcresult"
          xcodebuild test \
            -project TaptionEncoder.xcodeproj \
            -scheme TaptionEncoder \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
            -parallel-testing-enabled NO \
            OTHER_SWIFT_FLAGS='$(inherited) -disable-sandbox' \
            | tee build/xcodebuild.log

      - name: Summarize
        if: always()
        run: |
          grep -E "error:|warning:|Test Case .*(passed|failed)|Executed [0-9]+ tests|TEST (SUCCEEDED|FAILED)" \
            build/xcodebuild.log | tail -60 || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ${{ runner.temp }}/TestResults.xcresult
            build/xcodebuild.log
          retention-days: 7
